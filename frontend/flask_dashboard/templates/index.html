<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AgriTech - Flask</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <div class="container my-4">
      <div class="card shadow-sm">
        <div class="card-body">
          <h1 class="card-title">🌾 AgriTech</h1>
          <p class="text-muted">Get intelligent crop recommendations and irrigation decisions.</p>

          <div class="mb-3">
            <h6>Model Status</h6>
            <span class="badge bg-{{ 'success' if status.crop_model else 'danger' }} me-1">Crop: {{ 'Loaded' if status.crop_model else 'Missing' }}</span>
            <span class="badge bg-{{ 'success' if status.irrigation_model else 'danger' }} me-1">Irrigation: {{ 'Loaded' if status.irrigation_model else 'Missing' }}</span>
            <span class="badge bg-{{ 'success' if status.optimization_model else 'danger' }}">Optimization: {{ 'Loaded' if status.optimization_model else 'Missing' }}</span>
            <div class="form-check form-switch d-inline-block ms-3">
              <input class="form-check-input" type="checkbox" id="themeToggle">
              <label class="form-check-label small text-muted" for="themeToggle">Dark mode</label>
            </div>
          </div>

          <form action="{{ url_for('predict') }}" method="post">
            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label">N (Nitrogen)</label>
                <input class="form-control" type="number" name="N" value="80" step="1">
              </div>
              <div class="col-md-4">
                <label class="form-label">P (Phosphorus)</label>
                <input class="form-control" type="number" name="P" value="48" step="1">
              </div>
              <div class="col-md-4">
                <label class="form-label">K (Potassium)</label>
                <input class="form-control" type="number" name="K" value="40" step="1">
              </div>

              <div class="col-md-4">
                <label class="form-label">Temperature (°C)</label>
                <input class="form-control" type="number" name="temp" value="23.0" step="0.1">
              </div>
              <div class="col-md-4">
                <label class="form-label">Humidity (%)</label>
                <input class="form-control" type="number" name="hum" value="82.0" step="0.1">
              </div>
              <div class="col-md-4">
                <label class="form-label">Soil pH</label>
                <input class="form-control" type="number" name="ph" value="6.7" step="0.1">
              </div>

              <div class="col-md-6">
                <label class="form-label">Rainfall (mm)</label>
                <input class="form-control" type="number" name="rain" value="240.0" step="0.1">
              </div>
              <div class="col-md-3">
                <label class="form-label">Soil Moisture</label>
                <input class="form-control" type="number" name="soil_moisture" value="0.35" step="0.01">
              </div>
              <div class="col-md-3">
                <label class="form-label">Wind Speed (km/h)</label>
                <input class="form-control" type="number" name="wind_speed" value="8.0" step="0.1">
              </div>

              <div class="col-md-4">
                <label class="form-label">Pressure (kPa)</label>
                <input class="form-control" type="number" name="pressure" value="101.3" step="0.1">
              </div>

              <div class="col-12 d-flex align-items-center gap-3 mt-2">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="use_mock" name="use_mock">
                  <label class="form-check-label" for="use_mock">Use mock predictions (ignore real models)</label>
                </div>

                <button class="btn btn-success ms-auto" type="submit">Get Recommendations</button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/app.js"></script>
  </body>
</html>
